# meta-ctt: Connectivity Test Tool agent for the DUT image
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ctt"
BBFILE_PATTERN_ctt = "^${LAYERDIR}/"
BBFILE_PRIORITY_ctt = "10"

LAYERDEPENDS_ctt = "core"
# Set this to the Yocto release(s) of your BSP (e.g. "kirkstone", "scarthgap")
LAYERSERIES_COMPAT_ctt = "dunfell gatesgarth hardknott honister kirkstone langdale mickledore nanbield scarthgap styhead walnascar"
