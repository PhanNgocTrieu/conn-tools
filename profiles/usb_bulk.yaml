# USB bulk throughput with the board as a USB DEVICE (gadget).
# Prerequisites (see docs/usb.md):
#   1. DUT port in device/OTG mode:   ctt usb gadget up --dut root@<ip>
#   2. USB cable DUT <-> PC, device attached to WSL:
#        PowerShell: .\scripts\usbipd-attach.ps1 -HardwareId 1d6b:0104 -AutoAttach
#   3. ctt profile profiles/usb_bulk.yaml --dut root@<ip>
# The agent server on the DUT binds the gadget itself (udc=auto).
# NOTE: through WSL/usbipd, USB throughput is capped (~30-40 MB/s); use a
# native Linux host for sign-off numbers. Thresholds are placeholders.
name: usb-bulk
defaults:
  transport: usb
  duration: 20s
  timeout: 20s
  expect:
    lost_max: 0

tests:
  - name: up                 # host -> DUT (bulk OUT)
    mode: tx
    expect: {up_mbps_min: 100}
  - name: down               # DUT -> host (bulk IN)
    mode: rx
    expect: {down_mbps_min: 100}
  - name: bidir
    mode: bidir
  - name: rtt
    mode: echo
    duration: 10s
  - name: block
    mode: tx
    duration: 10s
    matrix:
      block: [4K, 64K, 512K]
