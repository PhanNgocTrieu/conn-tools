# WiFi throughput, DUT as server, host in WSL (networkingMode=mirrored)
#   ctt profile profiles/wifi_tcp_throughput.yaml --dut root@<DUT-WiFi-IP>
# Adjust the expect thresholds to the product requirement.
name: wifi-tcp-throughput
defaults:
  transport: tcp
  duration: 30s
  sndbuf: 1M
  rcvbuf: 1M
  expect:
    lost_max: 0

tests:
  - name: up
    mode: tx
    expect: {up_mbps_min: 50}
  - name: down
    mode: rx
    expect: {down_mbps_min: 50}
  - name: bidir
    mode: bidir
  - name: rtt
    mode: echo
    duration: 10s
    expect: {rtt_p99_us_max: 50000}
