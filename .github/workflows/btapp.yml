name: ctt-agent build + release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One program, ctt-agent, in one folder per platform (same layout as scripts/build.sh):
#   ctt-agent-aarch/ctt-agent        every aarch64 board (static)
#   ctt-agent-linux/ctt-agent        Linux / WSL x86_64 (static)
#   ctt-agent-window/ctt-agent.exe   Windows console;  ctt-agent-UI.exe  Windows desktop window
jobs:
  aarch:
    name: ctt-agent-aarch (aarch64 boards, static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu cmake
      - run: scripts/build.sh aarch
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-agent-aarch
          path: build/ctt-agent-aarch/ctt-agent

  linux:
    name: ctt-agent-linux (x86_64, static) + all tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # dbus + python3-dbus + python3-gi: BLE GATT test with a fake BlueZ (window-app/tests/test_ble_links.py)
      - run: sudo apt-get update && sudo apt-get install -y cmake python3-yaml python3-tk xvfb dbus python3-dbus python3-gi
      - run: scripts/build.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-agent-linux
          path: build/ctt-agent-linux/ctt-agent
      - name: GUI smoke test (Xvfb)
        run: CTT_BT_SMOKE=1 xvfb-run -a scripts/ctt-app

  window:
    name: ctt-agent-window (ctt-agent.exe + ctt-agent-UI.exe)
    needs: aarch
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/window-app/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-aarch
          path: build/.work/stage
      - run: python -m pip install --upgrade pip pyinstaller pillow -r window-app/requirements.txt
      - name: Windows Bluetooth API probe
        run: |
          python -c "import socket; assert hasattr(socket, 'AF_BLUETOOTH') and hasattr(socket, 'BTPROTO_RFCOMM'), 'no RFCOMM sockets'; print('RFCOMM socket support OK')"
          python -c "from winrt.windows.devices.bluetooth import BluetoothDevice; from winrt.windows.devices.enumeration import DeviceInformation, DevicePairingKinds; print('selector', BluetoothDevice.get_device_selector_from_pairing_state(False)[:80]); print('pairing kinds', DevicePairingKinds.CONFIRM_ONLY | DevicePairingKinds.CONFIRM_PIN_MATCH)"
      - name: Unit tests that run on Windows
        working-directory: window-app/tests
        run: python -m unittest test_btapp.BoardHelpersTest test_btapp.CtpClientTest.test_pattern_crc test_btapp_service.SettingsTest test_btapp_service.ConsoleMenuTest test_btapp_expectations test_btapp_trace.FormatTest test_ble_links.CapabilityTest -v
      - name: GUI smoke test (window + screenshot)
        env:
          CTT_BT_SMOKE: smoke.png
        run: python -m ctt.btapp
      - name: Build ctt-agent.exe + ctt-agent-UI.exe
        shell: pwsh
        run: window-app\build.ps1 -Agent build\.work\stage\ctt-agent -SkipInstall
      - name: ctt-agent.exe smoke test
        shell: pwsh
        run: |
          build\ctt-agent-window\ctt-agent.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          build\ctt-agent-window\ctt-agent.exe run --help
          build\ctt-agent-window\ctt-agent.exe suite --list -l target
          if ($LASTEXITCODE -ne 0) { throw "suite --list failed" }
          # menu: piped output must be UTF-8 English text, then exit with 0
          $menu = "0" | build\ctt-agent-window\ctt-agent.exe
          $menu | Out-String | Write-Host
          if (-not ($menu -match "Test suite")) { throw "console menu not shown" }
          # links: Windows runs RFCOMM and BLE GATT, BLE CoC is reported as not available
          $caps = build\ctt-agent-window\ctt-agent.exe caps | Out-String
          Write-Host $caps
          if (-not ($caps -match "ble-gatt\s+yes")) { throw "BLE GATT (bleak) not available in the exe" }
          if (-not ($caps -match "ble-coc\s+no")) { throw "BLE CoC should be reported as not available on Windows" }
      - name: ctt-agent-UI.exe smoke test
        shell: pwsh
        run: |
          $env:CTT_BT_SMOKE = "1"
          $p = Start-Process build\ctt-agent-window\ctt-agent-UI.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ctt-agent-UI.exe exited with $($p.ExitCode)" }
          Get-ChildItem build\ctt-agent-window | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-agent-window
          path: |
            build/ctt-agent-window/ctt-agent.exe
            build/ctt-agent-window/ctt-agent-UI.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gui-screenshot
          path: smoke.png

  # Every push to main refreshes the "latest-main" pre-release; a v* tag makes a release.
  # Assets: ctt-agent-aarch.tar.gz, ctt-agent-linux.tar.gz, ctt-agent-window.zip, SHA256SUMS
  # (each archive holds its ctt-agent-<platform>/ folder). GitHub adds the source code itself.
  release:
    name: publish release (main -> latest-main, tags -> vX.Y.Z)
    needs: [aarch, linux, window]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in the sources
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/version.sh check "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-aarch
          path: pkg/ctt-agent-aarch
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-linux
          path: pkg/ctt-agent-linux
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-window
          path: pkg/ctt-agent-window
      - name: Collect assets
        run: |
          find pkg -type f | sort
          chmod +x pkg/ctt-agent-aarch/ctt-agent pkg/ctt-agent-linux/ctt-agent
          mkdir -p assets
          (cd pkg && tar czf ../assets/ctt-agent-aarch.tar.gz ctt-agent-aarch \
                   && tar czf ../assets/ctt-agent-linux.tar.gz ctt-agent-linux \
                   && zip -r ../assets/ctt-agent-window.zip ctt-agent-window)
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes header
        run: |
          cat > notes.md <<EOF
          One program, \`ctt-agent\`, one package per platform:

          | Package | Contains | Runs on |
          |---|---|---|
          | \`ctt-agent-aarch.tar.gz\` | \`ctt-agent\` | every aarch64 board (copy to \`/tmp/ctt-agent\`, \`chmod +x\`) |
          | \`ctt-agent-linux.tar.gz\` | \`ctt-agent\` | Linux / WSL x86_64 |
          | \`ctt-agent-window.zip\` | \`ctt-agent.exe\`, \`ctt-agent-UI.exe\` | Windows: console (also over SSH), desktop window |

          Built from ${GITHUB_SHA}. Check the downloads with \`sha256sum -c SHA256SUMS\`.
          EOF
          cat notes.md
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "CTT $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
      - name: Rolling pre-release of main
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest-main --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-main assets/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "CTT latest main (${GITHUB_SHA::7})" --notes-file notes.md
