name: ctt-bt app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  agent-aarch64:
    name: ctt-agent for the board (aarch64, static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu cmake ninja-build
      - run: scripts/build-dut.sh --generic --static --strip
      - run: file build/dut/agent/ctt-agent
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-agent-aarch64
          path: build/dut/agent/ctt-agent

  linux-tests:
    name: host build + all tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3-yaml python3-tk xvfb
      - run: scripts/build-host.sh
      - name: GUI smoke test (Xvfb)
        run: CTT_BT_SMOKE=1 xvfb-run -a python3 -m ctt.btapp

  windows-exe:
    name: ctt-bt.exe + ctt-agent-console.exe (Windows)
    needs: agent-aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-aarch64
          path: dist/agent
      - run: python -m pip install --upgrade pip pyinstaller pillow -r requirements-btapp.txt
      - name: Windows Bluetooth API probe
        run: |
          python -c "import socket; assert hasattr(socket, 'AF_BLUETOOTH') and hasattr(socket, 'BTPROTO_RFCOMM'), 'no RFCOMM sockets'; print('RFCOMM socket support OK')"
          python -c "from winrt.windows.devices.bluetooth import BluetoothDevice; from winrt.windows.devices.enumeration import DeviceInformation, DevicePairingKinds; print('selector', BluetoothDevice.get_device_selector_from_pairing_state(False)[:80]); print('pairing kinds', DevicePairingKinds.CONFIRM_ONLY | DevicePairingKinds.CONFIRM_PIN_MATCH)"
      - name: Unit tests that run on Windows
        run: python -m unittest tests.test_btapp.BoardHelpersTest tests.test_btapp.CtpClientTest.test_pattern_crc tests.test_btapp_service.SettingsTest tests.test_btapp_service.ConsoleMenuTest tests.test_btapp_expectations -v
      - name: GUI smoke test (window + screenshot)
        env:
          CTT_BT_SMOKE: smoke.png
        run: python -m ctt.btapp
      - name: Build exes (GUI + console)
        shell: pwsh
        run: .\scripts\build-btapp.ps1 -Agent dist\agent\ctt-agent -SkipInstall
      - name: Console exe smoke test
        shell: pwsh
        run: |
          dist\ctt-agent-console.exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          dist\ctt-agent-console.exe run --help
          dist\ctt-agent-console.exe suite --list -l target
          if ($LASTEXITCODE -ne 0) { throw "suite --list failed" }
          # menu: piped output must be UTF-8 English text, then exit with 0
          $menu = "0" | dist\ctt-agent-console.exe
          $menu | Out-String | Write-Host
          if (-not ($menu -match "Test suite with Mbit/s expectations")) { throw "console menu not shown" }
      - name: Exe smoke test
        shell: pwsh
        run: |
          $env:CTT_BT_SMOKE = "1"
          $p = Start-Process dist\ctt-bt.exe -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "ctt-bt.exe exited with $($p.ExitCode)" }
          Get-Item dist\ctt-bt.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-bt-windows
          path: |
            dist/ctt-bt.exe
            dist/ctt-agent-console.exe
            smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: ctt-agent-console-windows
          path: dist/ctt-agent-console.exe

  # Deploy: every push to main refreshes the "latest-main" pre-release; a v* tag makes a release.
  # Assets: ctt-agent-console.exe, ctt-bt.exe, ctt-agent-aarch64 (board), SHA256SUMS.
  release:
    name: publish release (main -> latest-main, tags -> vX.Y.Z)
    needs: [agent-aarch64, linux-tests, windows-exe]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ctt-bt-windows
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ctt-agent-aarch64
          path: out/agent
      - name: Collect assets
        run: |
          # artifact layout keeps the common parent folder (dist/ next to smoke.png): find by name
          find out -type f | sort
          mkdir -p assets
          for f in ctt-agent-console.exe ctt-bt.exe; do
            cp "$(find out -type f -name "$f" | head -1)" assets/
          done
          cp "$(find out/agent -type f -name ctt-agent | head -1)" assets/ctt-agent-aarch64
          ls -la assets
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "CTT $GITHUB_REF_NAME" --generate-notes
      - name: Rolling pre-release of main
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest-main --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-main assets/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "CTT latest main (${GITHUB_SHA::7})" \
            --notes "Built from $GITHUB_SHA. Download ctt-agent-console.exe / ctt-bt.exe (Windows) and ctt-agent-aarch64 (board). Check with SHA256SUMS."
