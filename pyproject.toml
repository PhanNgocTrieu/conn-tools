[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctt"
version = "0.1.0"
description = "Connectivity Test Tool - USB / WiFi / Bluetooth / MFi throughput testing for embedded DUTs"
requires-python = ">=3.8"
dependencies = ["pyyaml>=5.1"]

[project.scripts]
ctt = "ctt.cli:main"

[tool.setuptools.packages.find]
include = ["ctt*"]
