[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctt"
version = "1.0.0"
description = "Connectivity Test Tool - USB / WiFi / Bluetooth / MFi throughput testing for embedded DUTs"
requires-python = ">=3.8"
dependencies = ["pyyaml>=5.1"]

[project.scripts]
ctt = "ctt.cli:main"
ctt-agent-gui = "ctt.btapp.__main__:main"   # Windows exe: ctt-agent.exe (the board binary is also ctt-agent)
ctt-agent-console = "ctt.btapp.__main__:console_main"

[tool.setuptools.packages.find]
include = ["ctt*"]

