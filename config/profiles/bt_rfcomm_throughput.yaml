# Bluetooth Classic throughput: RFCOMM (SPP-like) and L2CAP BR/EDR.
# The agent server runs on the DUT; the WSL host connects through a
# USB BT dongle attached with usbipd. Pair first:
#   ctt bt pair --dut root@<dut-ip> [--dut-accept]
#   ctt profile config/profiles/bt_rfcomm_throughput.yaml --dut root@<dut-ip>
#
# RFCOMM channel: 0 = the kernel on the DUT picks a free channel (avoids
# clashing with HFP/PBAP/SPP channels of the product stack). Set `port:` to pin it.
# Thresholds are placeholders - set them from the product requirement.
# Practical ceilings: EDR 3 Mbps radio => ~2.0-2.2 Mbps RFCOMM goodput; 2 Mbps EDR ~1.4.
name: bt-rfcomm-throughput
defaults:
  transport: rfcomm
  duration: 30s
  timeout: 20s                 # BT links can stall longer than TCP
  expect:
    lost_max: 0

tests:
  - name: rfcomm-up            # host -> DUT
    mode: tx
    expect: {up_mbps_min: 1.0}
  - name: rfcomm-down          # DUT -> host
    mode: rx
    expect: {down_mbps_min: 1.0}
  - name: rfcomm-bidir
    mode: bidir
  - name: rfcomm-rtt
    mode: echo
    duration: 10s
    block: 64
    echo_interval_ms: 20
    expect: {rtt_p99_us_max: 100000}

  # Write size vs throughput (RFCOMM frame ~1000 B, ACL MTU dependent)
  - name: rfcomm-block
    mode: tx
    duration: 15s
    matrix:
      block: [127, 990, 4K, 32K]

  # Cost of encryption / authentication levels
  - name: rfcomm-security
    mode: tx
    duration: 15s
    matrix:
      transport_opts.security: [low, medium, high]

  # L2CAP connection-oriented channel on BR/EDR (no RFCOMM framing overhead)
  - name: l2cap-bredr-up
    transport: l2cap
    mode: tx
    transport_opts: {type: bredr, imtu: 1691}
