# Miracast / Wi-Fi Display (screen mirroring) - traffic model
#
# Real Miracast: WiFi Direct (P2P) link; the source sends an MPEG-2 transport stream in
# RTP over UDP (7 x 188 B TS packets = 1316 B per datagram); RTSP (TCP) controls the
# session; UIBC (TCP) carries input back from the sink.
#
# Roles: board = sink / display (CTT server), PC = source (CTT client).
#   tx = source -> sink (video),  rx = sink -> source (UIBC input)
#
# Run: ctt profile config/profiles/wifi/miracast.yaml --dut root@<board> --target-addr <board-p2p-ip>
name: wifi-miracast
defaults:
  duration: 60s
  protocol: Miracast / Wi-Fi Display
  wifi_iface: auto

tests:
  - name: mirroring-1080p30
    parallel:
      - name: rtp-video
        notes: MPEG-TS over RTP/UDP, ~15 Mbit/s at 30 fps = 62.5 KB per frame in 1316-byte datagrams
        transport: udp
        mode: tx
        block: 1316
        burst: 62500
        burst_rate: 30
        expect: {loss_pct_max: 1, burst_on_time_pct_min: 98, burst_max_gap_ms_max: 150}
      - name: uibc-input
        notes: user input back channel (TCP), 60 Hz small events
        transport: tcp
        mode: rx
        block: 64
        burst: 64
        burst_rate: 60
        expect: {burst_on_time_pct_min: 98}
      - name: rtsp-control
        transport: tcp
        mode: echo
        block: 256
        echo_interval_ms: 100
        expect: {rtt_p99_us_max: 50000}
  - name: mirroring-4k30
    notes: 4K source at ~40 Mbit/s
    transport: udp
    mode: tx
    block: 1316
    burst: 166K
    burst_rate: 30
    expect: {loss_pct_max: 1, burst_on_time_pct_min: 98}
